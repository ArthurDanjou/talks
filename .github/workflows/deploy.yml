name: Deploy talks to Cloudflare Pages

# Secrets requis dans le dépôt :
# - CLOUDFLARE_API_TOKEN : jeton avec le droit Cloudflare Pages: Edit
# - CLOUDFLARE_ACCOUNT_ID : identifiant du compte Cloudflare

on:
  push:
    branches: [master]
    paths:
      - '20*/**'
      - 'site/**'
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install TeX Live
        uses: zauguin/install-texlive@v4.4.0
        with:
          cache: true
          cache_version: 1
          packages: |
            scheme-basic
            latexmk
            amsfonts
            amsmath
            appendixnumberbeamer
            babel-french
            beamer
            graphics
            lm
            xcolor

      - name: Compile LaTeX slides
        run: |
          for tex in 20*/*/slides.tex; do
            [ -f "$tex" ] || continue
            (cd "$(dirname "$tex")" && latexmk -pdf -interaction=nonstopmode slides.tex)
          done

      - name: Build Slidev decks
        # Chaque dossier 20*/*/ qui contient un slides.md est construit.
        run: |
          for deck in 20*/*/slides.md; do
            [ -f "$deck" ] || continue
            dir=$(dirname "$deck")
            (
              cd "$dir"
              bun install --frozen-lockfile
              bunx slidev build --base "/$dir/" --out dist
            )
          done

      - name: Prepare site
        run: |
          mkdir -p dist
          cp site/_redirects dist/_redirects
          for pdf in 20*/*/slides.pdf; do
            [ -f "$pdf" ] || continue
            mkdir -p "dist/$(dirname "$pdf")"
            cp "$pdf" "dist/$pdf"
          done
          for deck in 20*/*/slides.md; do
            [ -f "$deck" ] || continue
            dir=$(dirname "$deck")
            if [ -d "$dir/dist" ]; then
              mkdir -p "dist/$dir"
              cp -R "$dir/dist/." "dist/$dir/"
            fi
          done

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=talks --commit-dirty=true
